<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التضامن والتنسيق الميداني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>منصة تنسيق المبادرات التضامنية</h1>
        <p>تنظيم ومتابعة المهام الميدانية للفرق التطوعية</p>
    </header>

    <main class="container">
        <section class="form-section">
            <h2>إضافة مبادرة أو مهمة ميدانية</h2>
            <form id="initiativeForm">
                <div class="form-group">
                    <label for="initiativeName">اسم المبادرة / المهمة:</label>
                    <input type="text" id="initiativeName" required placeholder="مثال: قفة رمضان، حملة تنظيف...">
                </div>
                <div class="form-group">
                    <label for="initiativeLocation">المكان / المنطقة:</label>
                    <input type="text" id="initiativeLocation" required placeholder="مثال: الجزائر العاصمة">
                </div>
                <div class="form-group">
                    <label for="initiativeDate">التاريخ:</label>
                    <input type="date" id="initiativeDate" required>
                </div>
                <button type="submit" class="btn-submit">إضافة المبادرة</button>
            </form>
        </section>

        <section class="list-section">
            <h2>المبادرات الحالية</h2>
            <div id="initiativesContainer" class="initiatives-grid">
               
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
